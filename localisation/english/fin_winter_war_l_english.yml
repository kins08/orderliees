l_english:
 fin_speed_debuff_border: "Deep Snow: Borderlands"
 fin_speed_debuff_border_desc: "Harsh conditions in the frontier Finnish taiga and heavy snowdrifts restrict enemy advances. (Enemy speed penalty: -50%)"
 fin_speed_debuff_mid: "Deep Snow: Central Regions"
 fin_speed_debuff_mid_desc: "Severe winter terrain and thick snow significantly slow the tempo of hostile offensive operations. (Enemy speed penalty: -85%)"
 fin_speed_debuff_deep: "Deep Snow: Interior Territories"
 fin_speed_debuff_deep_desc: "Impassable snowdrifts, frozen lakes, and ferocious resistance completely immobilize advancing enemy formations. (Enemy speed penalty: -90%)"
 fin_winter_war_spirit: "The Winter War"
 fin_winter_war_spirit_desc: "The Finnish Army is exceptionally trained for winter warfare on its native soil, expertly maneuvering, defending, and mitigating enemy air superiority casualties. Reduces enemy air superiority combat bonus by 50%. Active only while at war with the USSR."
 fin_counterattack: "Strike from the Snow"
 fin_counterattack_desc: "Following resilient defense and breaking the encirclement, Finnish forces launch a decisive counter-offensive across core territory."
 FIN_remove_speed_debuff: "Breaking the Encirclement"
 FIN_remove_speed_debuff_desc: "By establishing control over the southern approaches to Leningrad, positional restrictions on Finnish regions are lifted, the Winter War status concludes, and counter-strike operations begin."
 FIN_join_axis_auto: "Joining the Axis Powers"
 FIN_join_axis_auto_desc: "With a direct land border secured alongside German forces via Karelia, Finland formally enters the Axis alliance. The special Winter War status is concluded."
 FIN_winter_debuffs_tt: "Applies 'Deep Snow' modifiers to Finnish regions: enemy forces are slowed by 50%, 85%, or 90% depending on territorial depth."
 FIN_march_removes_winter_tt: "Removes regional 'Deep Snow' penalties from Finnish territories."
 FIN_end_winter_war_tt: "Conclusion of the Winter War: all regional speed penalties and Winter War effects are removed."
 FIN_remove_winter_debuffs_tt: "All 'Deep Snow' regional penalties are removed from Finnish territories."
 FIN_remove_winter_war_spirit_tt: "Removes 'The Winter War' spirit."
