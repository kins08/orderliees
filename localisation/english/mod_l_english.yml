 news.1000.d:0 "Today Anglo-American expeditionary forces executed the largest amphibious landing of the Mediterranean theater. Allied troops stormed ashore across Morocco and Algeria, held by Vichy forces. Despite stubborn localized resistance, Vichy units proved unable to sustain prolonged defense. Control of French North Africa opens the direct path toward Tunisia, threatening the Axis underbelly."
