 FRA_integrate_conquered_territories_desc:0 "Conquered lands must be integrated into the French Empire. Establishing unified administration, legal codes, and cultural institutions secures imperial unity."
 FRA_core_conquered_state:0 "Incorporate State «[FROM.GetName]» into Bourbon Domains"
 FRA_core_conquered_state_desc:0 "Conquered territories historically belong to the House of Bourbon and must be officially recognized as an integral part of our empire. We shall assert our dynastic rights over [FROM.GetName], ensuring full integration into the French state apparatus. This will solidify our influence and lay an enduring foundation for future generations."
 FRA_new_bourbon_era_tt:0 "Unlocks decisions to §YIntegrate Conquered Territories§!, asserting the §HDynastic Rights of the Bourbons§! over §BEuropean lands§! and turning them into §Gcore states§! of the §2French Empire§!."
 FRA_back_to_benelux_tt:0 "It is time to right the wrongs of the past and return the §BLow Countries§! to direct Paris control, making the Benelux core. §YIntegration of conquered territories§! will erase borders hindering the grandeur of the §2French Empire§!."
 FRA_claims_on_catalonia_tt:0 "The Pyrenees shall no longer divide our lands. We will establish §BFrench supremacy§! on the peninsula, turning Catalonia into a §Gcore territory§! of the great §2Empire§!, while in non-cored lands £compliance_gain_texticon£§40.25%§! of Spaniards will submit to our rule daily."
 FRA_attack_switzerland_tt:0 "The Alps must serve as the shield of France rather than a haven for our enemies. §BSwiss mountain passes§! will fall under the Grande Armée's control, with £compliance_gain_texticon£§40.25%§! daily compliance gain securing the §2Empire's§! strategic dominion."
 FRA_back_to_italy_tt:0 "Piedmont is the key to Northern Italy. We will assert §BFrench historical rights§! over the region, turning it into a §Gcore territory§!."
 FRA_fraspain3_tt:0 "France will restore its primacy over the Benelux, subjugating it and reforming local administration. Daily £compliance_gain_texticon£§40.25%§! compliance will be gained under our rule."
 FRA_fraspain2_tt:0 "Portugal has historically been within the sphere of the Iberian crown. It is time to complete the integration of the peninsula under unified Bourbon authority. We will press legitimate dynastic claims to annex Portuguese territories, gaining £compliance_gain_texticon£§40.25%§! daily compliance."




