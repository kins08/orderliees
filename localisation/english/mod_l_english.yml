 SUBDOCTRINE_MARINES_2:0 "Expeditionary Forces"
 SUBDOCTRINE_MARINES_2_DESC:0 "Expeditionary doctrine tailored for protracted amphibious operations and challenging terrain warfare."
 marines_2_reward_1:0 "Expeditionary Organization"
 marines_2_reward_1_desc:0 "Rigorous command staff hierarchy and logistics optimize amphibious combat readiness."
 marines_2_reward_2:0 "Marine Firepower Training"
 marines_2_reward_2_desc:0 "Equipping vanguard landing echelons with rapid-fire automatic weapons significantly increases soft attack."
 marines_2_reward_3:0 "Coastal Beachhead Assault"
 marines_2_reward_3_desc:0 "Specialized landing craft procedures reduce naval landing penalties and bolster defensive resilience."
 marines_2_reward_4:0 "Desert and Plains Adaptation"
 marines_2_reward_4_desc:0 "Conditioning for arid climates and open terrain ensures effective combat across varied littoral theaters."
 marines_2_reward_5:0 "Expeditionary Shock Assault"
 marines_2_reward_5_desc:0 "Peak operational coordination across landing echelons grants decisive special forces offensive power."

 SUBDOCTRINE_MOUNTAINEERS_2:0 "Mountain Shock Troops"
 SUBDOCTRINE_MOUNTAINEERS_2_DESC:0 "Establishing regular alpine shock corps with elite mountain warfare conditioning and high-altitude combat doctrine."
 mountaineers_2_reward_1:0 "Alpine Command & Cohesion"
 mountaineers_2_reward_1_desc:0 "Specialized high-altitude command structures ensure exceptional organizational stability."
 mountaineers_2_reward_2:0 "Mountain Marksmanship"
 mountaineers_2_reward_2_desc:0 "Precision firing training across steep gradients substantially increases mountaineer soft attack."
 mountaineers_2_reward_3:0 "Mountain Shock Potential"
 mountaineers_2_reward_3_desc:0 "Equipping alpine battalions with specialized pack artillery elevates both offensive impact and defensive tenacity."
 mountaineers_2_reward_4:0 "High-Altitude Mastery"
 mountaineers_2_reward_4_desc:0 "Supreme mastery of mountainous and hilly terrain guarantees combat dominance."
 mountaineers_2_reward_5:0 "Alpine Assault Momentum"
 mountaineers_2_reward_5_desc:0 "Rigorous alpine assault conditioning provides overwhelming attack power to all special forces."

 SUBDOCTRINE_MOUNTAINEERS_1:0 "Alpine Specialists"
 SUBDOCTRINE_MOUNTAINEERS_1_DESC:0 "Mastery of extreme high-altitude alpine warfare, mountaineering reconnaissance, and mountain artillery support."
 mountaineers_1_reward_1:0 "Alpine Conditioning"
 mountaineers_1_reward_1_desc:0 "Rigorous high-altitude training builds unmatched physical endurance."
 mountaineers_1_reward_2:0 "Mountain Pack Artillery"
 mountaineers_1_reward_2_desc:0 "Lightweight mountain guns carried by mule trains across high passes."
 mountaineers_1_reward_3:0 "High-Altitude Marksmanship"
 mountaineers_1_reward_3_desc:0 "Specialized sniper and rifle marksmanship adjusted for thin mountain air."
 mountaineers_1_reward_4:0 "Ridge Defense Systems"
 mountaineers_1_reward_4_desc:0 "Interlocking defensive redoubts carved into cliff faces and crests."
 mountaineers_1_reward_5:0 "Alpine Spearheads"
 mountaineers_1_reward_5_desc:0 "Elite mountaineer battalions seizing impenetrable peaks."

 SUBDOCTRINE_PARATROOPERS_2:0 "Mass Airborne Drop"
 SUBDOCTRINE_PARATROOPERS_2_DESC:0 "Massed airborne assault doctrine engineered for seizing vital rear communications, transport arteries, and strategic bridges."
 paratroopers_2_reward_1:0 "Airborne Command Cohesion"
 paratroopers_2_reward_1_desc:0 "Rigid discipline and independent small-unit command maintain high organization upon landing."
 paratroopers_2_reward_2:0 "Airborne Rapid Fire"
 paratroopers_2_reward_2_desc:0 "Lightweight automatic submachine guns and carbines maximize initial firepower upon landing."
 paratroopers_2_reward_3:0 "Combat Drop Logistics"
 paratroopers_2_reward_3_desc:0 "Streamlined drop container retrieval and glider operations mitigate paradrop combat penalties."
 paratroopers_2_reward_4:0 "Urban and Forest Combat"
 paratroopers_2_reward_4_desc:0 "Mastery of close-quarters urban fighting and dense woods secures seized landing perimeters."
 paratroopers_2_reward_5:0 "Airborne Spearhead Assault"
 paratroopers_2_reward_5_desc:0 "Elite airborne assault formations break through surrounding enemy forces with decisive combat power."

 SUBDOCTRINE_RANGERS_1:0 "Ranger Traditions"
 SUBDOCTRINE_RANGERS_1_DESC:0 "Cultivating deep reconnaissance, woodland infiltration, marksmanship, and independent tactical command."
 rangers_1_reward_1:0 "Ranger Cohesion"
 rangers_1_reward_1_desc:0 "Decentralized tactical command and high individual accountability strengthen unit organization."
 rangers_1_reward_2:0 "Sharpshooter Ambush Tactics"
 rangers_1_reward_2_desc:0 "Sniper training and coordinated ambush volleys heavily amplify soft attack."
 rangers_1_reward_3:0 "Reconnaissance & Velocity"
 rangers_1_reward_3_desc:0 "Advanced scouting methods, stripped-down combat loads, and swift marching outmaneuver the adversary."
 rangers_1_reward_4:0 "Masters of Woodland & Ridges"
 rangers_1_reward_4_desc:0 "Expert navigation of forest trails and ridge systems ensures territorial superiority."
 rangers_1_reward_5:0 "Ranger Spearhead Surge"
 rangers_1_reward_5_desc:0 "Stealthily approaching objective lines before unleashing overwhelming special forces firepower."

 SUBDOCTRINE_RANGERS_2:0 "Jungle Warfare Preparation"
 SUBDOCTRINE_RANGERS_2_DESC:0 "Specialized tropical conditioning for prolonged operations in dense rainforests and impassable swampland."
 rangers_2_reward_1:0 "Tropical Organization"
 rangers_2_reward_1_desc:0 "Field organizational structures adapted to humid rainforest environments preserve unit cohesion."
 rangers_2_reward_2:0 "Dense Undergrowth Firefights"
 rangers_2_reward_2_desc:0 "Shortened automatic weapons and shotgun point-blank drills enhance close-quarters jungle soft attack."
 rangers_2_reward_3:0 "Tropical Endurance & Field Hygiene"
 rangers_2_reward_3_desc:0 "Comprehensive preventive medical measures drastically reduce attrition losses from tropical disease."
 rangers_2_reward_4:0 "Jungle & Marsh Navigation"
 rangers_2_reward_4_desc:0 "Navigating trackless swamps and jungle waterways provides decisive tactical advantage."
 rangers_2_reward_5:0 "Tropical Shock Assault"
 rangers_2_reward_5_desc:0 "Specialized jungle assault detachments deliver devastating offensive blows against fortified enclaves."
