 ordl_peace.4.t:0 "Fall of France"
 ordl_peace.4.d:0 "French forces cease organized resistance. A general armistice agreement has been concluded."
 ordl_peace.5.t:0 "Soviet Union Annexes Bessarabia"
 ordl_peace.5.d:0 "Following an ultimatum delivered to the Romanian government, the Soviet Union demanded the cession of Bessarabia and Northern Bukovina. Deprived of foreign support, Bucharest was compelled to accept Soviet demands.\n\nOn 28 June, Red Army formations crossed the Dniester, occupying Bessarabia. Romanian administrative authorities withdrew, transferring governance directly to the USSR."
 ordl_peace.5.a:0 "Impressive"
 ordl_peace.6.t:0 "Fall of the Soviet Union"
 ordl_peace.6.d:0 "Operation Barbarossa, initiated on 22 June 1941, has concluded in complete and decisive Axis triumph. German panzer spearheads and infantry armies have shattered Soviet strategic defense lines, enveloped core Red Army concentrations, and extinguished organized Soviet resistance in European Russia.\n\nThe Soviet regime has collapsed under the unrelenting hammer of German arms. A new continental order is established across the vast eastern territories, and remaining scattered resistance groups are being systematically eradicated.\n\nThe Eastern Front has fallen. Germany has achieved the greatest military triumph in its history."
 ordl_peace.6.a:0 "A New World Order?"
 ordl_peace.7.t:0 "Capitulation of Imperial Japan"
 ordl_peace.7.d:0 "Imperial Japan acknowledges ultimate defeat. Years of relentless attritional conflict have exhausted its industrial capacity: slipways stand idle without steel, raw material lanes are severed, and the once-mighty Imperial Japanese Navy rests at the bottom of the Pacific. Garrison forces isolated across outer island chains have been deprived of all sustenance, while continental armies are trapped in grinding defeat.\n\nIn the Imperial Palace, the momentous decision has been sealed. The Imperial Rescript broadcasts unconditional surrender to the Japanese people. Weapons are cast aside, and white flags ascend over fortresses across East Asia and the Pacific. The era of Japanese militarist expansion has come to an end."
 ordl_peace.7.a:0 "Impressive"
