 ordl_peace.2.t:0 "Axis Expelled from North Africa"
 ordl_peace.2.d:0 "Allied forces have conclusively driven Axis formations from North Africa, restoring total control across the Mediterranean littoral. Months of grueling desert warfare have reached their culmination, swinging the strategic balance irrevocably toward Allied supreme command.\n\nThe liberation of deep-water harbors, railway corridors, and air bases secures crucial Mediterranean convoy lanes and sets the stage for amphibious assaults into Southern Europe. Captured infrastructure is being rapidly modernized, with regional stockpiles mobilized to support forthcoming Allied offensives."
 ordl_peace.2.a:0 "Shocking"
 ordl_peace.1.t:0 "Triumph in Egypt"
 ordl_peace.1.d:0 "After an exhaustive campaign, Axis forces have established complete control over Egypt. The fall of this pivotal territory strikes a grievous blow against British dominance in the Middle East and imperils Allied communications through the Suez Canal—a critical maritime artery connecting the Empire.\n\nCaptured deepwater ports, forward airfields, supply depots, and rail hubs significantly strengthen the Axis logistical network, laying the groundwork for further advances into the Levant. Command has issued urgent directives to rehabilitate local transport infrastructure and redirect all regional fuel and supply stores toward the ongoing war effort."
 ordl_peace.1.a:0 "Impressive"
