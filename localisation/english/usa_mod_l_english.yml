 USA_WPA: "§YWorks Progress Administration (WPA)§!"
 USA_WPA_desc: "The Works Progress Administration is an independent federal agency established by President Franklin D. Roosevelt under the New Deal. Its mandate is to provide public employment for millions of unemployed workers, channeling civilian labor into vital public infrastructure."
 USA_law_about_social: "Social Welfare of Americans"
 USA_law_about_social_desc: "While American living standards historically surpassed much of the world, deepening economic dislocation threatens social cohesion. We must define the federal government's obligations to citizens and establish resilient social safety nets to preserve democratic stability."
 USA_confidence_building_company: "Federal Corporate Funding"
 USA_confidence_building_company_desc: "By allocating emergency federal credit into key corporations, we can arrest the deflationary spiral crippling the national economic ecosystem."
 USA_dam_construction: "The McMillan Hydroelectric Plan"
 USA_dam_construction_desc: "A massive federal civil engineering initiative for the Pacific Northwest and national river basins, erecting immense dams and modern transmission grids to supply abundant electrical power."
 USA_plan_to_help_farmers: "Agricultural Relief Act"
 USA_plan_to_help_farmers_desc: "American agriculture has endured five grueling years of collapse under the Depression. Foreclosures and plummeting crop prices have devastated the heartland. Federal loan guarantees and subsidized credit will allow farmers to modernize machinery and protect domestic yields."
 USA_civilian_corps: "Southern Regional Development"
 USA_civilian_corps_desc: "The American South lags severely behind the industrialized Northeast. Directed federal funding into Southern highways, electrification, and manufacturing facilities will elevate regional productivity."
 USA_rural_development_program: "Federal Administrative Reform"
 USA_rural_development_program_desc: "Stagnation within federal bureaus impairs relief delivery. Injecting dynamic technocrats and fresh administrative leadership will restore operational efficiency to governance."
 USA_national_resource_council_dm: "§YNational Resources Planning Board§!"
 USA_resource_gay_tt: "Modify $USA_national_resource_council_dm$ to:"
 USA_national_resource_council: "National Resources Planning Board"
 USA_national_resource_council_desc: "Establish a federal board to survey and supervise strategic mineral reserves across the United States, curbing speculative corruption and ensuring critical raw materials flow directly to priority industries."
 USA_strategic_supply_planning: "Strategic Material Stockpiles"
 USA_strategic_supply_planning_desc: "Accumulate reserve stores of essential tungsten, chromium, bauxite, and petroleum to insulate American industry against international supply disruptions."
 USA_research_council: "§YOffice of Scientific Research and Development§!"
 USA_research_council_desc: "Foster American scientific supremacy. By providing research grants, funding technical institutes, and establishing national talent discovery programs, the United States will lead the world in advanced technological innovation."
 USA_tennessee_valley_authority: "Tennessee Valley Authority (TVA)"
 USA_tennessee_valley_authority_desc: "The Great Depression demonstrated that natural catastrophes and unregulated markets can rival wartime devastation. The Tennessee Valley Authority harnesses regional rivers, delivers low-cost hydroelectric power, provides employment, and fuels industrial expansion."
 USA_development_of_the_aluminum_industry: "Expansion of the Aluminum Industry"
 USA_development_of_the_aluminum_industry_desc: "Targeted federal investments into bauxite refining and aluminum smelting lay the bedrock for mass aircraft production and sustained technological edge."
 USA_mobilisation_industry: "§YIndustrial Mobilization§!"
 USA_mobilisation_industry_desc: "For years, American industry operated exclusively on civilian terms. Rising global aggression demands immediate countermeasures. The federal government must organize factories, logistics, and skilled labor to safeguard democracy."
 USA_cooperation_with_detroit: "Contracts with Detroit Automotive"
 USA_cooperation_with_detroit_desc: "Detroit's colossal automotive assembly lines can produce far more than civilian automobiles. Federal procurement contracts and capital backing will transform these plants into the core of military vehicular production."
 USA_general_motors_organization: "American Locomotive Company (ALCO)"
 USA_cooperation_with_bell: "Procurement with Republic Aviation"
 USA_cooperation_with_bell_desc: "Republic Aviation brings pioneering engineering to pursuit and escort fighter design. Awarding major defense contracts accelerates fighter deliveries and secures air superiority."
 USA_the_law_on_production_priorities: "Defense Production Priorities Act"
 USA_the_law_on_production_priorities_desc: "In the shadow of rising conflict, the federal administration must possess statutory authority to allocate raw materials and tooling to defense contractors."
 USA_emergency_shipbuilding_program: "Emergency Shipbuilding Program"
 USA_emergency_shipbuilding_program_desc: "Command of the sea lanes is vital to national survival. Standardized modular merchant hulls and escort vessels will expand maritime throughput across the oceans."
 USA_war_time_industry_of_USA: "Wartime Industrial Conversion"
 USA_war_time_industry_of_USA_desc: "The United States holds the greatest manufacturing potential on Earth. Fully mobilizing our industrial base transforms America into the Arsenal of Democracy, ensuring Allied victory."
 USA_war_time_dm: "The Final Stand"
 USA_war_time_tt: "Modify §Y$USA_war_time_dm$§! to:"
 USA_military_science: "Science in Service of Democracy"
 USA_military_science_desc: "Modern warfare hinges upon technological disparity. American military laboratories and universities must forge weapons that eclipse any foreign adversaries."
 the_manhattan_project: "§YThe Manhattan Project§!"
 the_manhattan_project_desc: "The United States undertakes the urgent responsibility to develop atomic weaponry. The Manhattan Project gathers top physicists and colossal industrial facilities to unlock atomic power."
 USA_war_propaganda_mod: "§YRevise the Neutrality Act of 1935§!"
 USA_war_propaganda_mod_desc: "The Neutrality Acts were designed to avoid repeating the entanglements of the Great War. But the global order has fractured. Fascist and imperialist aggressors dismantle peace, while American industry remains tied to democratic survival abroad."
 USA_focus_on_europe_mod: "Neutrality Act Amendment"
 USA_focus_on_europe_mod_desc: "Congress debates the balance between isolationism and intervention. Amending the Neutrality Act permits cash arms sales to democracies, tilting the diplomatic scale."
 USA_focus_on_asia_mod: "Quarantine Policy"
 USA_focus_on_asia_mod_desc: "Aggressors must be quarantined like an epidemic. Economic embargoes, financial restrictions, and trade bans on strategic aviation fuel and steel will compel Tokyo to reconsider expansion."
 USA_focus_special_regime: "Proclaim Limited National Emergency"
 USA_focus_special_regime_desc: "The President calls for nationwide mobilization of civil defense, tightening coastal surveillance and accelerating defense logistics under executive authority."
 USA_giant_gets_sexy: "§RThe Giant Awakens§!"
 USA_giant_gets_sexy_desc: "A decade of economic depression dampened American confidence, but unprecedented vitality stirs within our heartland. Modern factories, top universities, and millions of skilled workers stand ready for a titanic surge."
 USA_global_potential: "§YGlobal Potential§!"
 USA_global_potential_desc: "America can no longer remain a detached continental power. Our industrial technologies, naval battlefleets, and financial strength underpin global stability. We must think in terms of planetary leadership."
 usa_potanzeval: "Global Potential"
 decision_cost_air_150: "£army_air_superiority_texticon §Y150§!"
 USA_lend_lease_supp_air: "Aviation Aid to China"
 USA_national_cometee_of_defence: "Form the National Defense Council"
 USA_national_cometee_of_defence_desc: "Establish a unified wartime advisory body bringing military planners, industrial magnates, and organized labor together to coordinate nationwide rearmament."
 USA_pentagon: "War Production Board"
