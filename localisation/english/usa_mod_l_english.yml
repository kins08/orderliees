 USA_synthetic_rubber_program_1_desc: "Combine chemical syndicates and petroleum refiners under federal charter to mass-produce Buna-S synthetic rubber."
 USA_synthetic_rubber_program_2: "Petrochemical Manufacturing Clusters"
 USA_synthetic_rubber_program_2_desc: "Construct colossal catalytic cracking plants and butadiene refineries, rapidly expanding domestic synthetic rubber output."
 USA_synthetic_rubber_program_3: "Synthetic Strategic Independence"
 USA_synthetic_rubber_program_3_desc: "Full commissioning of nationwide synthetic complexes, permanently resolving raw rubber deficits and ensuring abundant fuel and tires."
 USA_Navy_Asia: "Ship build"
 USA_Navy_Asia_desc: "Сосредоточив внимание на азиатском театре военных действий, мы выделяем колоссальные ресурсы на расширение и модернизацию наших верфей на западном побережье. Это позволит нам в кратчайшие сроки построить флот, способный доминировать в Тихом океане."
 USA_ASIA: "§RAll in Asia"
 USA_ASIA_desc: "§RWe are last hope"
 USA_ARMY:0 "Army Expansion"
 USA_ARMY_desc:0 "The Pentagon redirects the war department's attention to the Pacific and Asia. The armed forces will be reorganized around expeditionary warfare: special operations units receive expanded funding and priority in equipment procurement, preparing America to project power across the vast distances of the Pacific theater."
 USA_Army_Asia:0 "Army Focus on Asia"
 USA_Army_Asia_desc:0 "The United States Army is preparing for a Pacific war. Special forces training and equipment programs have been prioritized."

 USA_INDUSTRIAL:0 "Industrial Expansion"
 USA_INDUSTRIAL_desc:0 "The war economy pivots toward the East. New contracts and federal financing accelerate the construction of military factories, while heavy industry is granted expanded production capacity — the Arsenal of Democracy must now reach across the Pacific."



