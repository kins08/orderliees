 USA_rubber_programm: "Synthetic Rubber Expansion Program"
 USA_rubber_programm_desc: "Natural rubber supplies in Southeast Asia remain highly vulnerable to interdiction. Expanding domestic synthetic rubber processing is critical to national motorization."
 USA_USAGE: "USACE Infrastructure Works"
 USA_USAGE_desc: "The United States Army Corps of Engineers mobilizes: constructing hydroelectric dams, heavy-duty military highways, and concrete runways across the continent."
 USA_NO_LIMIT_WAR: "§YProclaim Unlimited National Emergency§!"
 USA_NO_LIMIT_WAR_desc: "Recognize reality: the United States must mobilize its total economic might, directing labor allocation, industrial capacity, and raw material distribution under emergency presidential authority."
 USA_war_prod_cometee: "War Production Board"
 USA_war_prod_cometee_desc: "Coordinate nationwide manufacturing contracts, eliminate redundant tooling, and focus civilian production toward armaments."
 USA_chensay_military: "Rearmament Public Works"
 USA_chensay_military_desc: "Defense appropriations generate millions of industrial jobs, lifting the economy through military manufacture."
 USA_Arsenal_of_democrasy_mod: "§YArsenal of Democracy§!"
 USA_Arsenal_of_democrasy_mod_desc: "America becomes the forge of victory for free nations. Every tank, aircraft, and Liberty ship rolling off our assembly lines hastens the triumph of liberty."
 USA_price_controll: "Establish Price Controls"
 USA_price_controll_desc: "Massive defense orders trigger domestic inflationary pressures. The Office of Price Administration stabilizes consumer goods prices to preserve domestic social equilibrium."
 USA_law_of_war_time: "War Powers Act"
 USA_law_of_war_time_desc: "Grant the executive branch statutory authority to reallocate defense industries, requisition strategic shipping, and guarantee continuous railway throughput."
 USA_war_centers_ASIA: "Combined Chiefs of Staff"
 USA_war_centers_ASIA_desc: "Unify Anglo-American operational planning, cryptographic intelligence, and naval coordination into a single command structure."
