l_english:



 SOV_evacuation:0 "Industrial Evacuation"



 SOV_evacuation_desc:0 "The Evacuation Council under the Council of People's Commissars. From July 1941 more than 2,500 plants were shipped east to the Urals, Siberia and Central Asia — disassembled, loaded with their machine tools and workers and rebuilt months later. Here you run that machine: send trains by region, pay political power and rolling stock, and the factories arrive in 30-60 days. The category is always visible. The first wave needs the «Industry to the Urals» focus, the second needs «Desperate Measures». At most two regions can be underway at once. Evacuated factories are spread round-robin across the Urals and Siberia. Trains can be dispatched by clicking region names on the map or by decision in this category; the evacuation map shows what is happening."



 ORDL_EVAC_HEADER:0 "INDUSTRIAL EVACUATION"











 ORDL_EVAC_STAT_OUT:0 "§GEvacuated§!: [?global.ordl_evac_out_ic|0] civ. · [?global.ordl_evac_out_af|0] mil. factories"



 ORDL_EVAC_STAT_LOST:0 "§RLost§!: [?global.ordl_evac_lost_ic|0] civ. · [?global.ordl_evac_lost_af|0] mil. factories"



 ORDL_EVAC_STAT_TRANSIT:0 "§YIn transit§!: [?SOV_evac_transit_civ|0] civ. · [?SOV_evac_transit_mil|0] mil. · §GDone§!: [?SOV_evac_regions_done|0] / 7"



 ORDL_EVAC_COST:0 "Echelon: §Y35§! political power and §Y20§! trains · §Y30–60§! days"



 ORDL_EVAC_WAVE_INFO:0 "Opens after “Industry of the Urals”"



 ORDL_EVAC_WAVE_INFO2:0 "Baltic States, Belarus, Northern Ukraine and Southern Ukraine are available. Second wave: North-West, Centre, South Caucasus."



