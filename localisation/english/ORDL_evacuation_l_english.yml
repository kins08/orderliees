 SOV_evac_second_echelon_desc:0 "The first echelon is gone. The Northwest, the Center and the Caucasus are next in line — everything that could not be moved last autumn and everything built during the winter is still standing there.\n\nThe Evacuation Council may now send the second echelon: twice the time, more trains, and every lost day costs factories."

 SOV_move_industry_to_the_urals_desc:0 "The evacuation plan is ready. The trains will go east, but moving industry is not a single order: every region is loaded separately, and its factories keep working for the front the whole time.\n\nThe Evacuation Council will be allowed to send trains from the Baltic states, Belarus and Ukraine. The order is signed when Germany is already at the border: without a war with her the focus cannot be taken."

 ordl_evac.1.t:0 "Industry Moves East"

 ordl_evac.1.d:0 "The Evacuation Council reports: §Y[?global.ordl_evac_out_ic|0]§! civilian and §Y[?global.ordl_evac_out_af|0]§! military factories have been moved out of the front-line regions. The equipment is being unloaded in the Urals, the Volga region and Siberia — some shops are already producing under open sky.\n\n§R[?global.ordl_evac_lost_ic|0]§! civilian and §R[?global.ordl_evac_lost_af|0]§! military factories were left behind on ground held by the enemy.\n\nWhat was saved cannot be rebuilt in a day. But it exists, and the front will get shells and tanks from plants the enemy does not have."



 ordl_evac.1.a:0 "The industry is saved — the front will be supplied."

 ORDL_EVAC_FOCUS_TT:0 "§GOpens§!: the “Industrial Evacuation” decision category, the evacuation map and the regional decisions.\nAn echelon costs 35 political power and 20 trains. Loading takes 30–60 days; factories keep working until it ends."

 ORDL_EVAC_FOCUS2_TT:0 "§GOpens the second echelon§!: the Northwest, the Center and the South Caucasus.\n60 days to load. Same price: 35 political power and 20 trains."

 ORDL_EVAC_REQ_WARGER:0 "§RWar with Germany is required.§!"

 ORDL_EVAC_REQ_FOCUS:0 "§RRequires the «Industry to the Urals» focus.§!"

 ORDL_EVAC_REQ_TWO:0 "§ROnly two regions can be underway at once.§!"


