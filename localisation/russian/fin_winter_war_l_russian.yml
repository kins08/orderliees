l_russian:
 fin_speed_debuff_border: "Глубокий снег: Приграничье"
 fin_speed_debuff_border_desc: "Суровые условия приграничной финской тайги и снежные заносы сковывают наступление противника. (Штраф скорости врага: -50%)"
 fin_speed_debuff_mid: "Глубокий снег: Центральные районы"
 fin_speed_debuff_mid_desc: "Тяжёлое зимнее бездорожье и глубокие снега существенно снижают темп наступательных операций врага. (Штраф скорости врага: -85%)"
 fin_speed_debuff_deep: "Глубокий снег: Внутренние территории"
 fin_speed_debuff_deep_desc: "Непроходимые сугробы, замёрзшие водоёмы и ожесточённое сопротивление практически парализуют наступающие вражеские части. (Штраф скорости врага: -90%)"
 fin_winter_war_spirit: "Зимняя война"
 fin_winter_war_spirit_desc: "Финская армия превосходно подготовлена к войне в зимних условиях на родной земле, умело маневрируя, держа оборону и минимизируя потери от вражеской авиации. Снижает вражеский бонус от превосходства в воздухе на 50%. Действует только во время войны с СССР."
 fin_counterattack: "Удар из снегов"
 fin_counterattack_desc: "После успешной обороны и прорыва блокады финские войска переходят в решительное контрнаступление на национальных территориях."
 FIN_remove_speed_debuff: "Прорыв кольца блокады"
 FIN_remove_speed_debuff_desc: "Установив контроль над южными подступами к Ленинграду, мы снимаем позиционные ограничения с регионов Финляндии, прекращаем действие статуса «Зимняя война» и получаем возможность нанести контрудар."
 FIN_join_axis_auto: "Присоединение к странам Оси"
 FIN_join_axis_auto_desc: "Установив прямую сухопутную границу с германскими войсками со стороны Карелии, Финляндия официально вступает в альянс Оси. Особый статус Зимней войны снимается."
 FIN_winter_debuffs_tt: "На финских регионах появляются модификаторы «Глубокий снег»: враг замедляется на 50/85/90% в зависимости от глубины территории."
 FIN_march_removes_winter_tt: "Снимает региональные штрафы «Глубокий снег» с финских территорий."
 FIN_end_winter_war_tt: "Окончание Зимней войны: снимаются все региональные штрафы на скорость и эффекты Зимней войны."
 FIN_remove_winter_debuffs_tt: "Все региональные штрафы «Глубокий снег» снимаются с финских территорий."
 FIN_remove_winter_war_spirit_tt: "Снимает статус «Зимняя война»."
