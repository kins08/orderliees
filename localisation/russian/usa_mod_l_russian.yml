 fra_decision_cost_dopp_700: "£GFX_FRA_go_and_get_texticon £infantry_equipment_texticon §Y700§!"

 fra_decision_cost_INF_2500: "£GFX_FRA_go_and_get_texticon £infantry_equipment_text_icon §Y3500§!"

 USA_pay_and_go_cat: "§YПрограма 'Заплати и Получи'§!"
 USA_pay_and_go_cat_desc: "Наша уникальная программа 'Заплати и Получи' станет новым витком экономических связей между нами и нашими союзниками.Мы сможем предложить им новейшее оружие,пока они будут вкладываться в нашу экономику."

 ENG_pay_and_go: "Пехотное снаряжение для §YАнглии§!"
 ENG_pay_and_go_DOPP: "Допп. снаряжение для §YАнглии§!"
 ENG_pay_and_go_ARTA: "Артиллерия для §YАнглии§!"

 FRA_pay_and_go_ARTA: "Артиллерия для §YФранции§!"
 FRA_pay_and_go_DOPP: "Допп. снаряжение для §YФранции§!"
 FRA_pay_and_go: "Пехотное снаряжение для §YФранции§!"










 USA_hist_Way: "Продолжение выполнения плана нового курса"


















 USA_trade_agreements: "Торговые соглашения"




 USA_strike_london: "Нанести удар по Лондону"
 USA_strike_london_desc: "Если старая империя не уважает Новый Свет, ей придётся столкнуться с силой, которую она сама когда-то породила."



 USA_strike_jap: "Нанести удар по Токио"




 USA_TVA: "Расширение производств"






 BEL_yes_fash: "§RСтрана недоступна для предложения,так как там правят враждебная нам партия(коммунисты или фашисты)§!"
 BEL_no_fash: "Бельгийцы известны своими станками и эффективностью производства.Наше сотрудничество принесет лишь пользу нашей легкой промышленности и вот что нам это даст\n\n1-й этап)§YДобавит динамический модификатор 'Сотрудничество с Бельгией',что даст:§!\nМакс. эффективность производства: §G5.0% §!\n-----------------------------------------------------------------2-oй этап)§YИзменить 'Сотрудничество с Бельгией' на:§!\nМакс. эффективность производства: §G7.5% §!\n-----------------------------------------------------------------3-ий этап)§YИзменить 'Сотрудничество с Бельгией' на:§!\nМакс. эффективность производства: §G10.0%§!\n\n§RВ итоге бельгийцы могут дать нам 22.5% макс. эффективности производства§!"
 BEL_no_more_gold: "§RСтрана недоступна для предложения,так как она отказала нам раньше§!"

 USA_no_fash: "Французы известны своими заводами и способностью повышать обьем выпуска товаров.Наше сотрудничество принесет лишь пользу нашей тяжелой промышленности и вот что нам это даст\n\n1-й этап)§YДобавит динамический модификатор 'Сотрудничество с Франций',что даст:§!\nОбъем заводского производства: §G5.0% §!\n-----------------------------------------------------------------2-oй этап)§YИзменить 'Сотрудничество с Франций' на:§!\nОбъем заводского производства: §G7.5% §!\n-----------------------------------------------------------------3-ий этап)§YИзменить 'Сотрудничество с Франций' на:§!\nОбъем заводского производства: §G10.0%§!\n\n§RВ итоге французы могут дать нам 22.5% объема заводского производства§!"
