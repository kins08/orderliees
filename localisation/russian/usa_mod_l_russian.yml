 USA_gold_for_fra.4t: "Отказ страны от сотрудничества"
 USA_gold_for_fra.4d: "Страна отказалась от сотрудничества с нами.Их представители заявляют,что разрывают любые экономические отношения с нашей страной и не будут предоставлять нам никаких дальнейших привелегий и льгот"
 USA_gold_for_fra.4a: "Черт бы их побрал"
 FRA_for_usa_no_gold: "§RСтрана отказала нам в экономическом сотрудничестве,полностью прервав процесс кооперативной работы.В дальнейшем мы не сможем обращаться к этой стране с предложениями по сотрудничеству.§!"
 FRA_gold_brake_tt: "§RПрервет процесс промышленного сотрудничества и больше к нам не смогут обращаться с предложениями по совместной работе и предоставлению льгот.§!"

 USA_gold_for_fra.1t: "Первый этап сотрудничества с Францией"
 USA_gold_for_fra.1d: "Американцы предлагают направить наших промышленников в их страну,чтобы помочь им улучшить их производство.За это они готовы хорошо заплатить,однако наши технологии частично окажуться у них.Часть Sénat de la France проголосовала за,другая против."
 USA_gold_for_fra.a: "Мы против сотрудничества с Америкой"
 USA_gold_for_fra.b: "Стоит попробовать"

 USA_gold_for_fra.2t: "Второй этап сотрудничества с Францией"
 USA_gold_for_fra.2d: "Американцы во второй раз отправили парламентеров по дело о сотрудничестве наих сран в сфере промышленности.Они предлагают выкупить часть промышленников,которые сейчас находяться в их стране,предоставим им самые комфортные условия жизни.Также они хотят открыть новые высшие заведения,где преподавать будут наши эксперты."
 USA_gold_for_fra.2a: "Впервый раз мы согласились,но сейчас это зашло слишком далеко"
 USA_gold_for_fra.2b: "Стоит попробовать и в этот раз"

 USA_gold_for_fra.3t: "Третий и финальный этап сотрудничества с Францией"
 USA_gold_for_fra.3d: "Спустя почти 1.5 лет продуктивной совместной работы,американцы хотят окончательно закрепить наше сотрудничество договором.20% выпускников наших топовых инженерных вузов будут отправляться в Америку,для прохождения практики.Там им будут платить достойную зарплату,даже выше чем у нас.Они смогут набираться опыта и передавать его в дальнейшем нашим американским коллегам."
 USA_gold_for_fra.3a: "Впервый и второй раз мы согласились,но сейчас это зашло слишком далеко"
 USA_gold_for_fra.3b: "Сотрудничество с Америкой будет на пользу нам обоим"

 USA_gold_for_uk.1t: "Первый этап сотрудничества с Англией"
 USA_gold_for_uk.1d: "Американские послы недавно прибыли в Лондон с предложением о совместной работе в сфере судостроительства.Они предлагают,чтобы мы отправили часть наших опытных судостроителей и инженеров в их страну,а они неплохо заплатят и вольют деньги в нашу быстро растущую экономику."
 USA_gold_for_uk.a: "Мы против сотрудничества с Америкой"
 USA_gold_for_uk.b: "Стоит попробовать"

 USA_gold_for_uk.2t: "Второй этап сотрудничества с Англией"
 USA_gold_for_uk.2d: "Наши союзники из за океана недавно снова направили нам предложение,в котором они предлагали баснословную сумму за некоторых проффесианол,прибывших недавно из нашей страны.Королевская семья и члены парламента уже предупреждены и большая часть из них прогосовала за,ведь с налаживание экономических связей с Америкой пойдет на пользу не только им,но и нам."
 USA_gold_for_uk.2a: "И первый раз был ошибкой,второй договор с Америкой станет убийственным"
 USA_gold_for_uk.2b: "Стоит попробовать и в этот раз"

 USA_gold_for_uk.3t: "Третий и финальный этап сотрудничества с Англией"
 USA_gold_for_uk.3d: "Американцы предложили окончательно и официально заверить наши экономические отношения.Они хотят,чтобы часть наших судостроительных предприятий переехала к ним,а также и часть персонала,работающего там.Взамен они готовы заплатит огромную сумму,вдоволь покрывающие все наши расходы."
 USA_gold_for_uk.3a: "Мы практически станет вассалом!"
 USA_gold_for_uk.3b: "Выпьем за наших новых друзей"

 USA_gold_for_bel.1t: "Первый этап сотрудничества с Бельгией"
 USA_gold_for_bel.1d: "Совсем недавно американцы,послав свою делегацию,передали нам очень интересное предложение.Они хотят пригласить часть наших специалистов,которые отвечают у нас за создание станков и повышение максимальной эффективности целых заводов."
 USA_gold_for_bel.a: "Мы против сотрудничества с Америкой"
 USA_gold_for_bel.b: "Стоит попробовать"

 USA_gold_for_bel.2t: "Второй этап сотрудничества с Бельгией"
 USA_gold_for_bel.2d: "Орел за океаном вновь обратил внимание на нас.На этот раз он предлагает частично выкупить наших инженеров,сейчас трудящихся у них в стране.Они предоставят им самые комфортные усовия проживания и дадут им все для счастливой жизни."
 USA_gold_for_bel.2a: "Второй договор будет расцениваться как гос. измена"
 USA_gold_for_bel.2b: "Стоит попробовать и в этот раз"

 USA_gold_for_bel.3t: "Третий и финальный этап сотрудничества с Бельгией"
 USA_gold_for_bel.3d: "Американцы хотят увековечить нашу дружбу и наши экономические отношения.Они предлагают частично перенести наши самые новые станки и станочное производство к ним,а взамен они готовы заплатить за все неудобства.Часть сената уже проголосовала против."
 USA_gold_for_bel.3a: "Если согласимся-станет вассалами гиганта"
 USA_gold_for_bel.3b: "Выпьем за наших новых друзей"

