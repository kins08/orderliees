 USA_operation_torch_desc: "Высадка союзников в Северной Африке переломит ход войны в Средиземноморье и откроет путь к вторжению в Италию."
 USA_synthetic_rubber_program_1: "Корпорация синтетических запасов"
 USA_synthetic_rubber_program_1_desc: "Объединение ведущих химических и нефтяных компаний под эгидой государственной корпорации для масштабного синтеза сырья и снятия ограничений на строительство НПЗ."
 USA_synthetic_rubber_program_2: "Нефтехимические кластеры"
 USA_synthetic_rubber_program_2_desc: "Строительство масштабных установок каталитического крекинга и бутадиеновых заводов, существенно ускоряющее ввод в строй новых мощностей."
 USA_synthetic_rubber_program_3: "Синтетическая независимость"
 USA_synthetic_rubber_program_3_desc: "Полное развертывание сети синтетических производств, окончательно ликвидирующее довоенный дебафф и обеспечивающее военную машину топливом и резиной."
