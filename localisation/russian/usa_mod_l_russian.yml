 USA_Navy_Asia: "Тихоокеанская программа судостроения"
 USA_Navy_Asia_desc: "Сосредоточив внимание на азиатском театре военных действий, мы выделяем колоссальные ресурсы на расширение и модернизацию наших верфей на западном побережье. Это позволит нам в кратчайшие сроки построить флот, способный доминировать в Тихом океане."
 USA_ASIA: "§RСтавка на Азию"
 USA_ASIA_desc: "§RМы последняя надежда!"
 USA_ARMY:0 "Расширение армии"
 USA_ARMY_desc:0 "Пентагон перенаправляет внимание военного ведомства на Тихоокеанский регион и Азию. Вооружённые силы перестраиваются под экспедиционные операции: подразделения специального назначения получают увеличенное финансирование и приоритет в поставках снаряжения — Америка готовится проецировать силу на огромные расстояния Тихоокеанского театра военных действий."

 USA_INDUSTRIAL:0 "Промышленное расширение"
 USA_INDUSTRIAL_desc:0 "Военная экономика разворачивается на Восток. Новые контракты и федеральное финансирование ускоряют строительство военных заводов, а тяжёлой промышленности выделяется расширенная производственная мощность — «Арсенал демократии» теперь должен дотянуться до Тихого океана."

 USA_Army_Asia:0 "Фокус армии на Азии"
 USA_Army_Asia_desc:0 "Армия США готовится к войне на Тихом океане. Программы подготовки и оснащения сил специального назначения получили приоритетный статус."


