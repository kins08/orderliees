 ordl_peace.4.t: "Падение Франции"
 ordl_peace.4.d: "Французские войска прекращают сопротивление. Подписано соглашение о перемирии."
 ordl_peace.5.t: "Советский Союз аннексирует Бессарабию"
 ordl_peace.5.d: "После предъявления Румынии ультиматума Советский Союз потребовал возвращения Бессарабии, считая её территорией, отторгнутой от России в период Гражданской войны. Не имея возможности оказать серьёзное сопротивление и оставшись без поддержки своих союзников, румынское правительство было вынуждено принять советские требования.\n\n28 июня части Красной армии перешли румынскую границу и начали занятие Бессарабии. Румынская администрация и войска приступили к отступлению, оставляя территорию под контроль СССР.\n\nБессарабия вновь оказалась под властью Москвы."
 ordl_peace.5.a: "Впечатляет"
 ordl_peace.6.t: "Падение Советского Союза"
 ordl_peace.6.d: "Операция «Барбаросса», начавшаяся 22 июня 1941 года, увенчалась полным успехом. Германские армии прорвали советские оборонительные линии, сокрушили основные силы Красной армии и завершили кампанию на востоке победой. \n\nСоветская власть, ещё недавно стремившаяся распространить коммунизм на всю Европу, теперь пала под ударами германского оружия. Над огромными территориями Востока установился новый порядок, а последние очаги организованного сопротивления были подавлены.\n\nВосточный фронт пал. Операция «Барбаросса» увенчалась успехом!\n\nГермания одержала величайшую победу в своей истории."
 ordl_peace.6.a: "Новый мировой порядок?"
 ordl_peace.7.t: "Капитуляция Японии"
 ordl_peace.7.d: "Императорская Япония признаёт поражение. Годы тотальной войны истощили промышленность страны: верфи стоят без стали, а некогда грозный флот покоится на дне Тихого океана. Гарнизоны на разбросанных островах отрезаны от метрополии и лишены снабжения, материковые армии увязли в войне на истощение.\n\nВ императорском дворце решение принято. Голос Тэнно, обращённый к нации, объявляет о безоговорочной капитуляции. Оружие складывается, а над крепостями Восточной Азии и Тихого океана поднимается белый флаг. Эпоха имперской экспансии подходит к концу."
 ordl_peace.7.a: "Впечатляет"
