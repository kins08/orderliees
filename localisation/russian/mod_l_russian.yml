 air_subdoctrine_carpet_bombing: "Ковровые бомбардировки"
 air_subdoctrine_carpet_bombing_desc: "Массированные дневные налёты армад тяжёлых бомбардировщиков для тотального разрушения промышленных центров."
 air_subdoctrine_torpedo_bombers: "Торпедоносная авиация"
 air_subdoctrine_torpedo_bombers_desc: "Концентрация торпедоносной и противокорабельной авиации для поражения флота противника."
 air_subdoctrine_all_weather_bombing: "Всепогодное бомбометание"
 air_subdoctrine_all_weather_bombing_desc: "Оснащение и подготовка экипажей тактических бомбардировщиков к действиям в сложных метеоусловиях."
 mobile_recon_assault_units: "Мобильные разведывательно-штурмовые отряды"
 mobile_recon_assault_units_desc: "Формирование подвижных штурмовых групп танков и САУ для быстрого развития успеха."
 field_engineering_works: "Полевые инженерные работы"
 field_engineering_works_desc: "Создание глубокоэшелонированной инженерной обороны и пулеметных узлов сопротивления."
 deep_battle: "Глубокий бой"
