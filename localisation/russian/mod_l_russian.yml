 ORDL_EVAC_STATUS_LINE:0 "[GetEvacStatusLine]"
 ORDL_EVAC_REQ_WARGER:0 "§RНужна война с Германией.§!"
 ORDL_EVAC_FOCUS_TT:0 "§GОткрывает§!: категорию «Эвакуация промышленности», карту вывоза и семь решений по регионам.\nЭшелон стоит 35 политической власти и 20 поездов. Вывоз идёт 30–60 дней; заводы работают на месте до конца срока.§!"
 ORDL_EVAC_LEGEND:0 "§GЗелёный§! — вывезено на восток · §bЧёрный§! — потеряно"
