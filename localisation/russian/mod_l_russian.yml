 new_mobile_warfare_desc: "Наносите удар там, где противник слабее всего. Доктрина маневренной войны делает ставку на скорость и внезапность, глубокие прорывы танковых клиньев и дезорганизацию тылов противника."
 new_fleet_in_being: "Флот открытого моря"
 new_fleet_in_being_desc: "Доктрина, ориентированная на сохранение мощного линейного флота, господство на море и контроль ключевых морских коммуникаций."
 new_convoy_raiding: "Рейдерство на конвои"
 new_convoy_raiding_desc: "Ориентация на подводную и крейсерскую войну с целью парализовать морскую торговлю и перерезать снабжение врага."
 new_base_strike: "Удар по базам"
 new_base_strike_desc: "Доктрина опирается на ударную мощь авианосных соединений для уничтожения вражеских баз и кораблей на дальних дистанциях."
 new_strategic_destruction: "Стратегическое разрушение"
 new_strategic_destruction_desc: "Доктрина ориентирована на завоевание господства в воздухе и систематическое уничтожение промышленного и военного потенциала противника."
 new_battlefield_support: "Непосредственная поддержка"
 new_battlefield_support_desc: "Доктрина ориентирована на тесное взаимодействие авиации с сухопутными войсками для достижения решающего успеха на поле боя."
 superior_firepower: "Превосходство в огневой мощи"
 superior_firepower_desc: "Опора на сокрушительную артиллерийскую и огневую мощь перед лицом любых наступательных операций."
 grand_battleplan: "Большой план операций"
 grand_battleplan_desc: "Тщательное планирование, эшелонированная оборона и накопление ресурсов для гарантированного достижения поставленных целей."
 mass_assault: "Массированный штурм"
 mass_assault_desc: "Опора на неисчерпаемые людские резервы, стойкость обороны и мощные контрудары на решающих направлениях."

 air_subdoctrine_fighter_homeland_defense: "Противовоздушная оборона родины"
 air_subdoctrine_fighter_homeland_defense_desc: "Чтобы мы могли эффективно вести боевые действия, необходимо любой ценой защитить промышленность и инфраструктуру от стратегических бомбардировщиков."
 air_subdoctrine_tactical_flexibility: "Тактическая гибкость"
 air_subdoctrine_tactical_flexibility_desc: "Агрессивная тактика завоевания превосходства в воздухе свободным поиском и инициативой пилотов."
 air_subdoctrine_escort_fighter: "Эскортная авиация"
 air_subdoctrine_escort_fighter_desc: "Сопровождение бомбардировочных соединений на полную дальность и расчистка воздушного пространства."
 air_subdoctrine_flying_artillery: "Летающая артиллерия"
 air_subdoctrine_flying_artillery_desc: "Применение бронированных штурмовиков в качестве подвижной артиллерии непосредственной поддержки пехоты."
 air_subdoctrine_dive_bombers: "Пикирующие бомбардировщики"
 air_subdoctrine_dive_bombers_desc: "Высокоточное бомбометание с крутого пикирования по ключевым узлам обороны противника."
 air_subdoctrine_flexible_fire_support: "Гибкая огневая поддержка"
