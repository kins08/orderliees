 rapid_dominance: "Быстрое преобладание"
 rapid_dominance_desc: "Стремительные скоординированные удары подвижных соединений при тесном взаимодействии с авиацией."
 operational_tactics: "Оперативная тактика"
 operational_tactics_desc: "Методичное планирование и сокрушительная концентрация артиллерийского огня."

 interception_priority: "Приоритетный перехват"
 interception_priority_desc: "Отработка скоростных перехватов и уничтожения ударных самолётов противника."
 air_defense_grids: "Сетка ПВО"
 air_defense_grids_desc: "Координация истребительных полков с наземными службами наблюдения и оповещения."
 air_wing_knowledge_transfer: "Обмен боевым опытом"
