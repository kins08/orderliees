 SUBDOCTRINE_MARINES_2: "Экспедиционные войска"
 SUBDOCTRINE_MARINES_2_DESC: "Доктрина экспедиционных сил, ориентированная на проведение десантных операций и боев в сложных природных условиях.\n\n§HУровни доктрины:§!\nI. Организация морпехов: §G+8§!, амфибий: §G+10§!\nII. Софт-атака морпехов: §G+8%§!\nIII. Защита §G+8%§! и штраф морской высадки §G-15%§!\nIV. Террейн: Пустыня (§G+10%§!), Равнина (§G+5%§!)\nV. Атака спецвойск: §G+10%§!"
 marines_2_reward_1: "Экспедиционная организация"
 marines_2_reward_1_desc: "Четкая штабная структура морской пехоты, подготовка экипажей амфибий и налаженное снабжение повышают их боевую организацию."
 marines_2_reward_2: "Огневая подготовка морпехов"
 marines_2_reward_2_desc: "Насыщение передовых десантных подразделений морской пехоты скорострельным автоматическим оружием усиливает противопехотную атаку."
 marines_2_reward_3: "Высадка на побережье"
 marines_2_reward_3_desc: "Специальная подготовка к десантированию с моря снижает боевой штраф при морской высадке и укрепляет оборону морской пехоты."
 marines_2_reward_4: "Адаптация к пустыням и равнинам"
 marines_2_reward_4_desc: "Опыт действий в условиях засушливого климата и открытых равнин позволяет морской пехоте эффективно наступать и обороняться на этих типах местности."
 marines_2_reward_5: "Штурмовой натиск экспедиционных сил"
 marines_2_reward_5_desc: "Высший уровень слаженности десантных групп обеспечивает решающее преимущество и сокрушительную силу атаки спецвойск."

 SUBDOCTRINE_MOUNTAINEERS_2: "Возвысить горнострелковые войска"
 SUBDOCTRINE_MOUNTAINEERS_2_DESC: "Формирование регулярных горнострелковых корпусов с высочайшими стандартами альпинистской подготовки и ведения войны на высотах.\n\n§HУровни доктрины:§!\nI. Организация горных стрелков: §G+8§!\nII. Софт-атака горных стрелков: §G+8%§!\nIII. Защита §G+8%§! и атака горнострелков §G+10%§!\nIV. Террейн: Горы (§G+10%§!), Холмы (§G+5%§!)\nV. Атака спецвойск: §G+10%§!"
 mountaineers_2_reward_1: "Горная организация и слаженность"
 mountaineers_2_reward_1_desc: "Специализированная командная структура горнострелковых частей обеспечивает высокую управляемость и организационную стойкость."
 mountaineers_2_reward_2: "Горное стрелковое мастерство"
 mountaineers_2_reward_2_desc: "Отработка прицельного огня в условиях сложного рельефа многократно увеличивает противопехотную атаку горных стрелков."
 mountaineers_2_reward_3: "Ударный потенциал горнострелков"
 mountaineers_2_reward_3_desc: "Усиление горнострелковых батальонов специализированным вооружением повышает их ударную мощь и защиту в обороне."
 mountaineers_2_reward_4: "Господство на высотах"
 mountaineers_2_reward_4_desc: "Мастерское владение тактикой боев в горах и холмистой местности гарантирует горным стрелкам превосходство в атаке и обороне."
 mountaineers_2_reward_5: "Альпийский натиск"
 mountaineers_2_reward_5_desc: "Венцом подготовки горных стрелков становится непревзойденная наступательная сила всех подразделений специального назначения."

 SUBDOCTRINE_MOUNTAINEERS_1: "Специалисты по зимним операциям"
 SUBDOCTRINE_MOUNTAINEERS_1_DESC: "Подготовка элитных лыжных и зимних подразделений, способных действовать в условиях экстремальных холодов, метелей и глубокого снега.\n\n§HУровни доктрины:§!\nI. Организация горных стрелков: §G+8§!\nII. Софт-атака горных стрелков: §G+8%§!\nIII. Защита горных стрелков §G+8%§! и потери от зимнего истощения §G-25%§!\nIV. Террейн: Зимние условия (§G+10%§!), Лес (§G+5%§!)\nV. Атака спецвойск: §G+10%§!"
 mountaineers_1_reward_1: "Зимняя дисциплина и снабжение"
 mountaineers_1_reward_1_desc: "Особый порядок несения службы и зимнего тылового обеспечения повышают организованность горнострелковых частей на морозе."
 mountaineers_1_reward_2: "Огневой бой на морозе"
 mountaineers_1_reward_2_desc: "Использование морозостойкого стрелкового оружия обеспечивает надежную противопехотную атаку горных стрелков в любую стужу."
 mountaineers_1_reward_3: "Зимняя стойкость"
 mountaineers_1_reward_3_desc: "Специальное утепленное снаряжение и полевой обогрев существенно снижают потери от зимнего истощения и укрепляют оборону горных стрелков."
 mountaineers_1_reward_4: "Хозяева снегов и лесов"
 mountaineers_1_reward_4_desc: "Применение лыж, маскхалатов и навыков выживания обеспечивает высокий боевой потенциал горных стрелков в снегах и таежных лесах."
 mountaineers_1_reward_5: "Полярный удар"
 mountaineers_1_reward_5_desc: "Неудержимый натиск закаленных в снегах бойцов приумножает общую атакующую мощь всех войск специального назначения."

 SUBDOCTRINE_PARATROOPERS_2: "Массированный десант"
 SUBDOCTRINE_PARATROOPERS_2_DESC: "Доктрина крупномасштабных воздушно-десантных операций с целью глубокого охвата и быстрого захвата ключевых узлов противника.\n\n§HУровни доктрины:§!\nI. Организация десантников: §G+8§!\nII. Софт-атака десантников: §G+8%§!\nIII. Защита десантников §G+8%§! и атака десантников §G+10%§!\nIV. Террейн: Город (§G+10%§!), Равнина (§G+5%§!)\nV. Атака спецвойск: §G+10%§!"
 paratroopers_2_reward_1: "Десантная слаженность"
 paratroopers_2_reward_1_desc: "Тщательная подготовка планов выброски обеспечивает безупречную боевую организацию десантных волн."
 paratroopers_2_reward_2: "Концентрация огня десанта"
 paratroopers_2_reward_2_desc: "Быстрое развертывание пулеметов и легких орудий обеспечивает плотный огонь по пехоте противника сразу после приземления."
 paratroopers_2_reward_3: "Ударный кулак десанта"
 paratroopers_2_reward_3_desc: "Специальная подготовка штурмовых групп парашютистов увеличивает их атаку и защищенность десантных частей."
 paratroopers_2_reward_4: "Бои за города и равнины"
 paratroopers_2_reward_4_desc: "Мастерство штурма городских узлов обороны и молниеносного развертывания на равнинах повышает боевую эффективность парашютистов."
 paratroopers_2_reward_5: "Решающий десантный штурм"
 paratroopers_2_reward_5_desc: "Массированный выброс лучших сил приводит к полному разгрому вражеского тыла благодаря возросшей атаке спецвойск."

 SUBDOCTRINE_RANGERS_1: "Егерские традиции"
 SUBDOCTRINE_RANGERS_1_DESC: "Опираясь на многовековые традиции егерей и лесных стрелков, части спецвойск превращаются в непревзойденных разведчиков и мастеров маневра.\n\n§HУровни доктрины:§!\nI. Организация егерей: §G+8§!\nII. Софт-атака егерей: §G+8%§!\nIII. Защита §G+8%§!, разведка §G+10%§! и скорость егерей §G+5%§!\nIV. Террейн: Лес (§G+10%§!), Холмы (§G+5%§!)\nV. Атака спецвойск: §G+10%§!"
 rangers_1_reward_1: "Егерская организация"
 rangers_1_reward_1_desc: "Автономное командование малыми подразделениями и высокая ответственность каждого бойца укрепляют организацию егерей."
 rangers_1_reward_2: "Меткая егерская стрельба"
 rangers_1_reward_2_desc: "Снайперская подготовка и шквальный огонь из засад многократно усиливают противопехотную атаку егерских частей."
 rangers_1_reward_3: "Разведка и мобильность"
 rangers_1_reward_3_desc: "Передовые методы ведения разведки, легкость экипировки и скорость марша позволяют опережать врага и укреплять оборону егерей."
 rangers_1_reward_4: "Властелины лесов и холмов"
 rangers_1_reward_4_desc: "Природное чутье и знание лесных троп гарантируют егерям подавляющее преимущество в атаке и обороне в лесах и на холмах."
 rangers_1_reward_5: "Егерский натиск"
 rangers_1_reward_5_desc: "Невидимые до решающего момента, егерские подразделения обрушивают на врага всю атакующую мощь элитных спецвойск."

 SUBDOCTRINE_RANGERS_2: "Подготовка к войне в джунглях"
 SUBDOCTRINE_RANGERS_2_DESC: "Специализированная подготовка подразделений к длительным боевым действиям в непроходимых тропических лесах и топких болотах.\n\n§HУровни доктрины:§!\nI. Организация егерей: §G+8§!\nII. Софт-атака егерей: §G+8%§!\nIII. Защита §G+8%§! и снижение истощения в джунглях §G-20%§!\nIV. Террейн: Джунгли (§G+10%§!), Болото (§G+5%§!)\nV. Атака спецвойск: §G+10%§!"
 rangers_2_reward_1: "Тропическая организация"
 rangers_2_reward_1_desc: "Адаптированная под условия влажных тропиков структура поддерживает высокую организацию егерских соединений."
 rangers_2_reward_2: "Огневой бой в зарослях"
 rangers_2_reward_2_desc: "Применение укороченного автоматического оружия в густом подлеске повышает противопехотную атаку егерей на коротких дистанциях."
 rangers_2_reward_3: "Тропическая выносливость"
 rangers_2_reward_3_desc: "Профилактика тропических болезней существенно снижает небоевые потери от истощения и укрепляет защиту егерей."
 rangers_2_reward_4: "Тропы джунглей и болот"
 rangers_2_reward_4_desc: "Специальная тактика перемещения в джунглях и через топи позволяет успешно атаковать и обороняться на сложнейшем рельефе."
 rangers_2_reward_5: "Тропический штурм"
 rangers_2_reward_5_desc: "Сформированные отряды 'зеленых призраков' обеспечивают сокрушительное превосходство в атаке всех сил специального назначения."
 marine_subdoctrines_default_add_mastery_bonus_effect_tooltip: "Добавляется бонус §G+10%§! к £doctrine_mastery §Yочкам освоения§! второстепенной доктрины «§Y$SUBDOCTRINE_MARINES_2$§!» на §Y240§! дней"
 paratrooper_subdoctrines_default_add_mastery_bonus_effect_tooltip: "Добавляется бонус §G+10%§! к £doctrine_mastery §Yочкам освоения§! второстепенной доктрины «§Y$SUBDOCTRINE_PARATROOPERS_2$§!» на §Y240§! дней"
