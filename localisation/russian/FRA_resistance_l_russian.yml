 FRA_CARD_AOF_TT:0 "§HФранцузская Западная Африка (AOF)§!\nВысокий приоритет вывоза (37.5%).\nВывезено: §G[?FRA:FRA_evac_aof_count|0]§! предприятий.\n\n§YНажмите, чтобы переместить камеру в регион.§!"
 FRA_CARD_AEF_TT:0 "§HФранцузская Экваториальная Африка (AEF)§!\nВысокий приоритет вывоза (37.5%).\nВывезено: §G[?FRA:FRA_evac_aef_count|0]§! предприятий.\n\n§YНажмите, чтобы переместить камеру в регион.§!"
 FRA_CARD_MADAGASCAR_TT:0 "§HМадагаскар§!\nНизкий приоритет вывоза (12.5%).\nВывезено: §G[?FRA:FRA_evac_madagascar_count|0]§! предприятий.\n\n§YНажмите, чтобы переместить камеру в регион.§!"
 FRA_CARD_GUIANA_TT:0 "§HФранцузская Гвиана§!\nНизкий приоритет вывоза (12.5%).\nВывезено: §G[?FRA:FRA_evac_guiana_count|0]§! предприятий.\n\n§YНажмите, чтобы переместить камеру в регион.§!"

 FRA_TIER_1_TT:0 "§HСтупень I (100K+ потерь Вермахта)§!\nСнижает штраф истощения Метрополии на §G10%§!.\nПосле капитуляции на 1 год: §G+0.3%§! рекрутов, §G+5%§! объем производства, §G+5%§! макс. производительность."
 FRA_TIER_2_TT:0 "§HСтупень II (250K+ потерь Вермахта)§!\nСнижает штраф истощения Метрополии на §G20%§!.\nПосле капитуляции на 1 год: §G+0.6%§! рекрутов, §G+10%§! объем производства, §G+10%§! макс. производительность."
 FRA_TIER_3_TT:0 "§HСтупень III (450K+ потерь Вермахта)§!\nСнижает штраф истощения Метрополии на §G30%§!.\nПосле капитуляции на 1 год: §G+0.9%§! рекрутов, §G+15%§! объем производства, §G+15%§! макс. производительность."
 FRA_TIER_4_TT:0 "§HСтупень IV (700K+ потерь Вермахта)§!\nСнижает штраф истощения Метрополии на §G40%§!.\nПосле капитуляции на 1 год: §G+1.2%§! рекрутов, §G+20%§! объем производства, §G+20%§! макс. производительность."
 FRA_TIER_5_TT:0 "§HСтупень V (1.0M+ потерь Вермахта)§!\nСнижает штраф истощения Метрополии на §G50%§! (вдвое).\nПосле капитуляции на 1 год: §G+1.5%§! рекрутов, §G+25%§! объем производства, §G+25%§! макс. производительность."

