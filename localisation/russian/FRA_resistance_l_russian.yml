l_russian:
 FRA_resistance_evac_category:0 "Эвакуация промышленности"
 FRA_resistance_evac_category_desc:0 "План эвакуации предприятий в колонии (AOF, AEF, Мадагаскар, Гвиана). Потери противника ослабляют штраф войск и принесут временные бонусы после падения Метрополии."
 FRA_resistance_evac_spectator_category:0 "Эвакуация промышленности Франции"
 FRA_resistance_evac_spectator_category_desc:0 "Сводка об эвакуации заводов Франции и потерях Вермахта."

 FRA_resistance_dynamic_modifier:0 "Оборона Метрополии"
 FRA_resistance_dynamic_modifier_desc:0 "Затяжные бои на французской территории тяжело сказываются на боеспособности армии. С каждым месяцем войны истощаются резервы, нарастают перебои со снабжением и усиливается усталость от боевых действий. Лишь тяжёлые потери, наносимые наступающему противнику, способны замедлить падение боевого духа."
 FRA_mainland_resistance:0 "Оборона Метрополии"
 FRA_mainland_resistance_desc:0 "Затяжные бои на французской территории тяжело сказываются на боеспособности армии. С каждым месяцем войны истощаются резервы, нарастают перебои со снабжением и усиливается усталость от боевых действий. Лишь тяжёлые потери, наносимые наступающему противнику, способны замедлить падение боевого духа."
 FRA_german_losses_buff:0 "Опыт боёв за Метрополию"
 FRA_german_losses_buff_desc:0 "Тяжёлые потери, понесённые немецкими войсками в боях за Францию, доказали уязвимость противника. В течение года колониальные заводы и мобилизационный аппарат действуют с повышенной отдачей."

