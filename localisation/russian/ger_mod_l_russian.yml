l_russian:


 GER_fate_of_yugoslavia_custom: "§YЮгославия будет расчленена.§! Каждая из стран Оси получит обещанные ей территории."
 GER_fate_of_greece_custom: "§YОперация «Марита» обеспечит контроль над Грецией.§! В соответствии с предварительными договорённостями Италия и Болгария получат предназначенные им территории."
 GER_expand_the_reichsautobahn_east_tt: "Добавит максимум §Yинфраструктуры§! в §YСаксонии§!, §YВосточной Марки§!, §YНидершлезиенге§! и §YОбершлезиене§!"
 GER_expand_the_reichsautobahn_south_tt: "Добавит максимум §Yинфраструктуры§! в §YБадене§!, §YВюртемберге§!, §YВерхней Баварии§! и §YНижней Баварии§!"
 GER_barbarossa_fate_of_the_reich_tooltip: "§R[Борьба за жизнь Рейха]§!\n\n«Этот час решит судьбу §YНемецкой Нации§! на грядущие §Wтысячелетия§!! Великое столкновение двух миров неизбежно, и в нем §Rне может быть компромиссов§!.\n\nЛибо §YВеликогерманский Рейх§! навсегда сокрушит смертельную угрозу на Востоке, либо мы падем под натиском §Rбольшевистских орд§!.\n\nВся история нашего народа вела к этой §Wрешающей битве§!. Каждый немецкий солдат, каждый танк и каждое орудие теперь подчинены одной священной цели: §Gвырвать Великую Победу§! и утвердить §Yвечное господство Рейха§!»"


 GER_speer_eastern_armaments: "Реорганизация министерства вооружений"
 GER_speer_eastern_armaments_desc: "Директивы рейхсминистра Шпеера установили жесткий производственный график и систему персональной ответственности руководителей предприятий. Устранение параллелизма между ведомствами сухопутных сил и люфтваффе позволило оптимизировать распределение материалов и кратно нарастить объемы поставок на Остфронт."
 GER_operation_blau: "Операция «Блау»"
 GER_operation_blau_desc: "Наступление на южном крыле Восточного фронта с целью захвата кавказской нефти. Ускорение промышленных исследований и приток нефти."
 GER_operation_citadel: "Операция «Цитадель»"
 GER_operation_citadel_desc: "Решающее танковое сражение на Восточном фронте. Даёт опыт армии и ускоряет разработку танковых и доктринальных технологий."
 GER_return_territories: "Окончательная ликвидация территориальных условий §RВерсальского диктата§!: границы 1914 года на Западе и Востоке вновь объявляются §Yнеотъемлемой частью Рейха§!."

 GER_operation_western_operations: "Западные операции"
 GER_operation_western_operations_desc: "Координация западных операций вермахта. Открывает операцию «Вахт ам Райн»."
 GER_op_barbarossa_tt: "§YОткрывает «Unternehmen Barbarossa»§!"
 GER_op_blau_tt: "§YОткрывает «Fall Blau»§!"
 GER_op_zitadelle_tt: "§YОткрывает «Unternehmen Zitadelle»§!"
 GER_op_sonnenblume_tt: "§YОткрывает «Unternehmen Sonnenblume»§!"
 GER_op_weiss_tt: "§YОткрывает «Fall Weiß»§!"
 GER_op_gelb_tt: "§YОткрывает «Fall Gelb»§!"
 GER_op_western_tt: "§YОткрывает «Wacht am Rhein»§!"
 GER_speer_advisor_tt: "§YАльберт Шпеер станет доступен в качестве советника§!"

 # Оперативные директивы ОКВ
 ordl_ger_offensives_category: "Оперативные директивы ОКВ"
 ordl_ger_offensives_category_desc: "Разработка и проведение ключевых наступательных операций Вермахта на Восточном и Западном фронтах."
 GER_activate_fall_blau: "План «Блау»"
 GER_activate_fall_blau_desc: "Масштабное наступление южного крыла Восточного фронта с целью прорыва к кавказским нефтепромыслам и выхода к Волге. Даёт бонус к атаке против СССР на 90 дней."
 GER_activate_operation_citadel: "Операция «Цитадель»"
 GER_activate_operation_citadel_desc: "Концентрированный бронетанковый удар навстречу друг другу для срезания вражеского выступа и окружения советских армий. Даёт бонус к атаке против СССР на 75 дней и армейский опыт."
 GER_activate_wacht_am_rhein: "Операция «Вахта на Рейне»"
 GER_activate_wacht_am_rhein_desc: "Решающее танковое контрнаступление на Западном фронте с целью рассечь порядки высадившихся союзников и сбросить их в море. Даёт бонус к атаке против западных союзников на 60 дней."
 GER_allies_landed_normandy_tt: "§YСоюзники высадились в Нормандии/Бретани, контролируют территорию Бельгии/Нидерландов или национальную территорию Германии§!"
