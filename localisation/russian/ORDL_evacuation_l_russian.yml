 SOV_evac_second_echelon:0 "Второй эшелон"
 SOV_evac_second_echelon_desc:0 "Продвижение немецких войск ставит под угрозу промышленные центры Северо-Запада, центральной полосы и Кавказа.\n\nСовет по эвакуации разворачивает второй эшелон для вывоза предприятий оборонного значения в глубокий тыл."
 SOV_move_industry_to_the_urals_desc:0 "План эвакуации западных предприятий в тыловые районы утверждён. С началом боевых действий Совет по эвакуации организует погрузку и отправку эшелонов из приграничных областей на Урал и в Сибирь."
 ordl_evac.1.t:0 "Первые заводы прибыли на Урал"
 ordl_evac.1.d:0 "Совет по эвакуации докладывает: первые эшелоны с оборудованием прибыли в тыловые районы. На восток вывезено §Y[?global.ordl_evac_out_ic|0]§! фабрик и §Y[?global.ordl_evac_out_af|0]§! военных заводов. Оборудование разворачивается на новых площадках Урала, Поволжья и Сибири.\n\nНа захваченной противником территории осталось §R[?global.ordl_evac_lost_ic|0]§! фабрик и §R[?global.ordl_evac_lost_af|0]§! военных заводов. Вывоз остальных регионов продолжается."

 ordl_evac.1.a:0 "Принять доклад."
 ORDL_EVAC_FOCUS_TT:0 "§GОткрывает§!: категорию «Эвакуация промышленности», карту вывоза и решения по регионам.\nОтправка эшелона стоит 35 политической власти и 20 поездов. Погрузка длится 30–60 дней, заводы работают до её окончания."
 ORDL_EVAC_FOCUS2_TT:0 "§GОткрывает второй эшелон§!: Северо-Запад, Центр и Юго-Кавказ.\nСрок вывоза — 60 дней. Стоимость: 35 политической власти и 20 поездов."
 ORDL_EVAC_REQ_WARGER:0 "§RТребуется состояние войны с Германией.§!"
 ORDL_EVAC_REQ_FOCUS:0 "§RТребуется фокус «Эвакуировать промышленность на Урал».§!"
 ORDL_EVAC_REQ_TWO:0 "§RОдновременно может эвакуироваться не более двух регионов.§!"

 ORDL_EVAC_LEGEND:0 "§CСиний§! ждёт · §YЗолотой§! грузится · §GЗелёный§! вывезен · §gТёмный§! потерян"
