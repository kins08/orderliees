l_russian:
 SOV_evacuation:0 "Эвакуация промышленности"
 SOV_evacuation_desc:0 "Совет по эвакуации при СНК СССР координирует демонтаж и перебазирование промышленных предприятий из угрожаемых районов на восток страны — на Урал, в Поволжье и Сибирь. Вывоз заводов требует подвижного состава и административных ресурсов.\n\nЭвакуация первого эшелона (Прибалтика, Белоруссия, Украина) доступна после фокуса «Эвакуировать промышленность на Урал». Второй эшелон (Северо-Запад, Центр, Кавказ) открывается фокусом «Отчаянные меры». Одновременно погрузка может идти не более чем в двух регионах."
 ORDL_EVAC_HEADER:0 "ЭВАКУАЦИЯ ПРОМЫШЛЕННОСТИ"
 ORDL_EVAC_STAT_OUT:0 "§GВывезено§!: [?global.ordl_evac_out_ic|0] фабрик · [?global.ordl_evac_out_af|0] воен. заводов"
 ORDL_EVAC_STAT_LOST:0 "§RПотеряно§!: [?global.ordl_evac_lost_ic|0] фабрик · [?global.ordl_evac_lost_af|0] воен. заводов"
 ORDL_EVAC_STAT_TRANSIT:0 "§YВ пути§!: [?SOV_evac_transit_civ|0] фабрик · [?SOV_evac_transit_mil|0] воен. заводов · §GГотово§!: [?SOV_evac_regions_done|0] / 7"
 ORDL_EVAC_COST:0 "Эшелон: §Y35§! полит. власти и §Y20§! поездов · срок §Y30–60§! дн."
 ORDL_EVAC_WAVE_INFO:0 "Открывается после «Эвакуировать промышленность на Урал»"
 ORDL_EVAC_WAVE_INFO2:0 "Первый эшелон: Прибалтика, Беларусь, Северная Украина, Южная Украина. Второй эшелон (Северо-Запад, Центр, Юго-Кавказ) — после фокуса «Отчаянные меры». Одновременно — не больше двух регионов."
